[pytest]
asyncio_mode = auto
testpaths = tests experiments
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: unit tests
    integration: integration tests
    contract: API contract tests
    e2e: end-to-end smoke tests
    exvivo: ex-vivo regression tests
    fault: fault injection tests
    overhead: overhead measurement tests
    slow: slow running tests
    experiment: tests derived from experiment findings (Шаг 4 checklist)
